services:
  webapp:
    # platform: linux/arm64 # uncomment for M1 macs
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: 'fedora_ingest_rails-webapp:latest'
    env_file:
      - ./.env
    volumes:
      - '.:/home/app/fedora_ingest_rails'
    ports:
      - '3000:80'
    depends_on:
      - postgres
      - filestore-db
  filestore-db:
    image: mysql:5.6
    container_name: filestore-db
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: mysqlpassword
    volumes:
      - ./database-data/mysql:/var/lib/mysql
      - ./resources:/docker-entrypoint-initdb.d/
    ports:
      - '3306:3306'
  worker:
    image: 'fedora_ingest_rails-webapp:latest'
    env_file:
      - ./.env
    volumes:
      - '.:/home/app/fedora_ingest_rails'
    entrypoint: /home/app/fedora_ingest_rails/bin/delayed_job run
    depends_on:
      - postgres
      - filestore-db
  postgres:
    image:  postgres:11
    container_name: postgres-db
    environment:
      POSTGRES_PASSWORD: mypassword
    volumes:
      - ./database-data/postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
