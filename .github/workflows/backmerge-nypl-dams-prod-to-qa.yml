name: Backmerge nypl-dams-prod Into QA

on:
  pull_request:
    types:
      - closed
    branches:
      - nypl-dams-prod

permissions:
  contents: read
  pull-requests: write

jobs:
  create_backmerge_pr:
    name: Create nypl-dams-prod to QA Backmerge PR
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Create or Reuse Backmerge PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'qa';
            const head = `${owner}:nypl-dams-prod`;

            const sourcePr = context.payload.pull_request;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base,
              head,
              per_page: 1,
            });

            if (existing.length > 0) {
              core.notice(`Backmerge PR already exists: #${existing[0].number}`);
              return;
            }

            const title = `Backmerge nypl-dams-prod into qa after #${sourcePr.number}`;
            const body = [
              'Automated backmerge PR created after a PR was merged into `nypl-dams-prod`.',
              '',
              `Source PR: #${sourcePr.number}`,
              '',
              'This PR is intentionally left for manual merge by a developer.'
            ].join('\n');

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: 'nypl-dams-prod',
                base,
                body,
                maintainer_can_modify: true,
                draft: false,
              });

              core.notice(`Created backmerge PR: #${pr.number}`);
            } catch (error) {
              const message = String(error.message || '');

              if (error.status === 422 && message.includes('No commits between')) {
                core.notice('No backmerge PR needed: no commits between nypl-dams-prod and qa.');
                return;
              }

              throw error;
            }