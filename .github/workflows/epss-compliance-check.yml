name: EPSS Compliance Check

on:
  pull_request:
    branches:
      - nypl-dams-prod

jobs:
  epss_compliance_check:
    name: 'EPSS Compliance Check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: 'EPSS Policy'
        uses: advanced-security/dependabot-epss-action@main
        with:
            token: ${{ secrets.DEPENDABOT_EPSS_ACTION_TOKEN }}
            epss-threshold: "0.01"
