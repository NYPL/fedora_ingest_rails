name: Deploy to Production

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  run_tests:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yml

  deploy_production:
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Assume AWS Deployer Role
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::557492996044:role/GithubActionsDeployerRole
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set Up Environment Variables for New Relic
        run: |
          echo "NEW_RELIC_ENVIRONMENT=production" >> $GITHUB_ENV
          echo "NEW_RELIC_CONFIG_FILE=config/newrelic.ini" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: collections-api
            IMAGE_TAG_LOCAL: ${{ github.sha }}
            IMAGE_TAG_REMOTE: latest
            NEW_RELIC_ENVIRONMENT: production
            NEW_RELIC_CONFIG_FILE: ${{ env.NEW_RELIC_CONFIG_FILE }}
        run: |
          docker build \
            --build-arg NEW_RELIC_ENVIRONMENT=$NEW_RELIC_ENVIRONMENT \
            --build-arg NEW_RELIC_CONFIG_FILE=$NEW_RELIC_CONFIG_FILE \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_LOCAL .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_LOCAL
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_LOCAL $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_REMOTE
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_REMOTE

      - name: Trigger ECS Deployment
        env:
          CLUSTER_NAME: collections-api-prod
          SERVICE_NAME: collections-api-prod
        run: |
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
